<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>2BeerBotRacer – Entries</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --red: #e8001d;
            --yellow: #f5c400;
            --dark: #0a0a0a;
            --panel: #111113;
            --border: #2a2a2e;
            --text: #f0f0f0;
            --muted: #666;
            --entry-h: 28px;
            --cols: 2;
            --rows: 10;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: transparent;
            font-family: 'Barlow Condensed', sans-serif;
            color: var(--text);
            width: 340px;
        }

        .widget {
            background: var(--panel);
            border: 1px solid var(--border);
            border-top: 3px solid var(--red);
            overflow: hidden;
            position: relative;
        }

        /* diagonal stripe accent top-right */
        .widget::before {
            content: '';
            position: absolute;
            top: 0; right: 0;
            width: 60px; height: 3px;
            background: var(--yellow);
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 10px 5px;
            border-bottom: 1px solid var(--border);
            background: #0d0d0f;
        }

        .header-logo {
            height: 22px;
        }

        .header-title {
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .header-count {
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            color: var(--yellow);
        }

        /* Two-column grid of entries */
        .entries-grid {
            display: flex; flex-direction: column;
            
            
        }

        .entry-row {
            display: flex;
            align-items: center;
            height: var(--entry-h);
            border-bottom: 1px solid var(--border);
            
        }

        /* Only animate when data actually changed */
        .animate .entry-row {
            animation: fadeSlide 0.25s ease both;
        }

        @keyframes fadeSlide {
            from { opacity: 0; transform: translateX(-6px); }
            to   { opacity: 1; transform: translateX(0); }
        }

        .entry-num {
            width: 28px;
            min-width: 28px;
            text-align: center;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--red);
            
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(232,0,29,0.06);
        }

        /* #29 → #69 easter egg */
        .entry-num.special {
            color: var(--yellow);
            background: rgba(245,196,0,0.08);
        }

        .entry-name {
            padding: 0 8px;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
            text-transform: uppercase;
        }

        .empty-slot {
            height: var(--entry-h);
            border-bottom: 1px solid var(--border);
            
        }
        

        /* Next open slot indicator */
        .empty-slot.next-slot {
            display: flex;
            align-items: center;
            padding-left: 10px;
            gap: 7px;
        }
        .next-slot-pip {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--yellow);
            animation: pipPulse 1.2s ease-in-out infinite;
            flex-shrink: 0;
        }
        .next-slot-label {
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.14em;
            color: var(--yellow);
            text-transform: uppercase;
            opacity: 0.6;
        }
        @keyframes pipPulse {
            0%, 100% { opacity: 1;   transform: scale(1); }
            50%       { opacity: 0.3; transform: scale(0.7); }
        }

        /* !race call-to-action bar */
        #race-cta {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 5px 10px;
            background: rgba(245, 196, 0, 0.07);
            border-top: 1px solid rgba(245, 196, 0, 0.15);
        }
        #race-cta.visible { display: flex; }
        .cta-text {
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: rgba(245, 196, 0, 0.5);
        }
        .cta-cmd {
            font-size: 0.78rem;
            font-weight: 900;
            letter-spacing: 0.06em;
            color: var(--yellow);
            font-style: italic;
        }

        /* Pagination footer */
        .footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 5px 10px;
            background: #0d0d0f;
            border-top: 1px solid var(--border);
        }

        .page-dots {
            display: flex;
            gap: 5px;
        }

        .dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--border);
            transition: background 0.2s;
        }

        .dot.active { background: var(--red); }

        .page-label {
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            color: var(--muted);
            text-transform: uppercase;
        }

        .status-dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: #333;
            transition: background 0.3s;
            display: inline-block;
            margin-right: 5px;
            vertical-align: middle;
        }
        .status-dot.live { background: #00e676; box-shadow: 0 0 6px #00e676; }

        #error-bar {
            background: #ff6b00;
            color: #000;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 4px 10px;
            letter-spacing: 0.05em;
            display: none;
        }

        /* ── LIST FULL OVERLAY ─────────────────────── */
        #full-overlay {
            display: none;
            position: absolute;
            inset: 0;
            z-index: 100;
            overflow: hidden;
            background: #000;
        }

        #full-overlay.entering { display: flex; animation: overlayIn 0.4s cubic-bezier(0.22,1,0.36,1) forwards; }
        #full-overlay.visible  { display: flex; opacity: 1; }
        #full-overlay.exiting  { display: flex; animation: overlayOut 0.5s ease-in forwards; }

        @keyframes overlayIn {
            from { clip-path: inset(0 100% 0 0); }
            to   { clip-path: inset(0 0% 0 0); }
        }
        @keyframes overlayOut {
            from { clip-path: inset(0 0% 0 0); opacity: 1; }
            to   { clip-path: inset(0 0 0 100%); opacity: 0; }
        }

        /* Checkerboard racing stripe top + bottom */
        .full-checker {
            position: absolute;
            left: 0; right: 0;
            height: 8px;
            background-image: repeating-linear-gradient(
                90deg,
                #fff 0px, #fff 8px,
                #000 8px, #000 16px
            );
        }
        .full-checker.top    { top: 0; }
        .full-checker.bottom { bottom: 0; }

        /* Red slash background */
        .full-slash {
            position: absolute;
            top: -40px; left: -60px;
            width: 140%; height: 200%;
            background: var(--red);
            transform: skewX(-8deg);
            animation: slashGrow 0.35s cubic-bezier(0.22,1,0.36,1) 0.3s both;
        }
        @keyframes slashGrow {
            from { transform: skewX(-8deg) scaleX(0); transform-origin: left; }
            to   { transform: skewX(-8deg) scaleX(1); transform-origin: left; }
        }

        /* Yellow accent slash */
        .full-slash2 {
            position: absolute;
            top: -40px; right: -20px;
            width: 35%; height: 200%;
            background: var(--yellow);
            transform: skewX(-8deg);
            animation: slashGrow 0.3s cubic-bezier(0.22,1,0.36,1) 0.45s both;
        }

        .full-content {
            position: relative;
            z-index: 10;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            padding: 12px;
        }

        .full-label {
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.75);
            opacity: 0;
            animation: textPop 0.3s ease 0.65s forwards;
        }

        .full-title {
            font-size: 3.2rem;
            font-weight: 900;
            font-style: italic;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: #fff;
            line-height: 1;
            text-shadow: 0 3px 24px rgba(0,0,0,0.5);
            opacity: 0;
            animation: titleSlam 0.4s cubic-bezier(0.16,1,0.3,1) 0.7s forwards;
        }

        .full-count {
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            color: var(--yellow);
            text-transform: uppercase;
            opacity: 0;
            animation: textPop 0.3s ease 0.9s forwards;
        }

        /* Confetti burst particles */
        .confetti-wrap {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 5;
        }
        .cp {
            position: absolute;
            width: 7px; height: 7px;
            opacity: 0;
            animation: cpFly 1s ease-out forwards;
        }
        @keyframes cpFly {
            0%   { opacity: 1; transform: translate(0,0) rotate(0deg) scale(1); }
            100% { opacity: 0; transform: translate(var(--tx), var(--ty)) rotate(var(--tr)) scale(0.4); }
        }

        @keyframes textPop {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes titleSlam {
            from { opacity: 0; transform: scale(1.2); }
            to   { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>
<div class="widget">
    <!-- List Full overlay -->
    <div id="full-overlay">
        <div class="full-checker top"></div>
        <div class="full-slash"></div>
        <div class="full-slash2"></div>
        <div class="confetti-wrap" id="confetti"></div>
        <div class="full-content">
            <div class="full-label">🏁 &nbsp; Race Entry</div>
            <div class="full-title">LIST FULL</div>
            <div class="full-count">30 / 30 RACERS</div>
        </div>
        <div class="full-checker bottom"></div>
    </div>
    <div id="error-bar">⚡ BOT DISCONNECTED — RECONNECTING…</div>
    <div class="header">
        <span class="header-title"><span class="status-dot" id="sdot"></span>ENTRIES</span>
        <img class="header-logo" src="https://2beerminimum.com/2beerbotracer/natmar.png" alt="2Beer">
        <span class="header-count" id="hcount">0 / 30</span>
    </div>
    <div class="entries-grid" id="grid"></div>
    <div id="race-cta">
        <span class="cta-text">Type</span>
        <span class="cta-cmd">!race</span>
        <span class="cta-text">to enter</span>
    </div>
    <div class="footer">
        <span class="page-label" id="page-label">PAGE 1 / 1</span>
        <div class="page-dots" id="dots"></div>
    </div>
</div>

<script>
    const WS_URL = "ws://localhost:64209";
    const PER_PAGE = 15; // 15 rows, single column
    const MAX_ENTRIES = 30;
    let ws = null;
    let allEntries = [];
    let lastFingerprint = '';
    let currentPage = 0;
    let pageTimer = null;
    let overlayShown = false; // guard — only trigger once per fill

    // ── CONFETTI ──────────────────────────────────────
    function spawnConfetti() {
        const wrap = document.getElementById('confetti');
        wrap.innerHTML = '';
        const colors = ['#e8001d','#f5c400','#fff','#00e676','#ff6b00'];
        for (let i = 0; i < 38; i++) {
            const el = document.createElement('div');
            el.className = 'cp';
            const x = (Math.random() * 120 - 60) + 'vw'; // spread wide
            const y = (Math.random() * -180 - 20) + 'px';
            const r = (Math.random() * 720 - 360) + 'deg';
            el.style.cssText = `
                left:${Math.random()*100}%;
                top:${40 + Math.random()*40}%;
                background:${colors[i % colors.length]};
                border-radius:${Math.random() > 0.5 ? '50%' : '2px'};
                --tx:${x}; --ty:${y}; --tr:${r};
                animation-delay:${0.7 + Math.random()*0.5}s;
                animation-duration:${0.8 + Math.random()*0.6}s;
            `;
            wrap.appendChild(el);
        }
    }

    // ── OVERLAY ───────────────────────────────────────
    function triggerFullOverlay() {
        if (overlayShown) return;
        overlayShown = true;

        const overlay = document.getElementById('full-overlay');

        // Rebuild overlay to reset animations (clone trick)
        const fresh = overlay.cloneNode(true);
        overlay.parentNode.replaceChild(fresh, overlay);
        fresh.id = 'full-overlay';

        // Enter
        fresh.className = 'entering';
        spawnConfetti();

        // Hold
        setTimeout(() => { fresh.className = 'visible'; }, 400);

        // Exit after ~8.5s total (400 enter + 8100 hold + 500 exit = ~9s)
        setTimeout(() => {
            fresh.className = 'exiting';
            setTimeout(() => {
                fresh.className = '';
                fresh.style.display = 'none';
            }, 500);
        }, 8500);
    }

    // Cheap fingerprint — only re-render if queue actually changed
    function fingerprint(entries) {
        return entries.map(e => `${e.number}:${e.name}`).join('|');
    }

    function followNewestEntry(previousCount, nextCount) {
        if (nextCount > previousCount) {
            currentPage = Math.floor((nextCount - 1) / PER_PAGE);
        }
    }

    function renderPage(animate) {
        const grid = document.getElementById('grid');
        const total = allEntries.length;
        const pages = Math.max(1, Math.ceil(total / PER_PAGE));
        if (currentPage >= pages) currentPage = 0;

        const slice = allEntries.slice(currentPage * PER_PAGE, (currentPage + 1) * PER_PAGE);
        const isFull = total >= MAX_ENTRIES;

        // First empty slot on this page (globally)
        const pageStart = currentPage * PER_PAGE;
        const nextSlotOnPage = total - pageStart;

        let html = '';
        for (let i = 0; i < PER_PAGE; i++) {
            if (i < slice.length) {
                const e = slice[i];
                const isSpecial = e.number == 69;
                html += `<div class="entry-row" style="animation-delay:${i*18}ms">
                    <div class="entry-num${isSpecial ? ' special' : ''}">${e.number}</div>
                    <div class="entry-name">${escHtml(e.name)}</div>
                </div>`;
            } else {
                const isNext = !isFull && i === nextSlotOnPage;
                html += isNext
                    ? `<div class="empty-slot next-slot"><div class="next-slot-pip"></div><div class="next-slot-label">Open</div></div>`
                    : `<div class="empty-slot"></div>`;
            }
        }

        grid.className = animate ? 'entries-grid animate' : 'entries-grid';
        grid.innerHTML = html;

        // Dots
        const dotsEl = document.getElementById('dots');
        let dotHtml = '';
        for (let i = 0; i < pages; i++) {
            dotHtml += `<div class="dot${i === currentPage ? ' active' : ''}"></div>`;
        }
        dotsEl.innerHTML = dotHtml;

        document.getElementById('page-label').textContent = `PAGE ${currentPage + 1} / ${pages}`;
        document.getElementById('hcount').textContent = `${total} / ${MAX_ENTRIES}`;

        // !race CTA — swap content based on full state
        const cta = document.getElementById('race-cta');
        if (isFull) {
            cta.innerHTML = `<span class="cta-cmd">🏁</span><span class="cta-text">LIST FULL — ENTRIES CLOSED</span><span class="cta-cmd">🏁</span>`;
            cta.style.background = 'rgba(232, 0, 29, 0.1)';
            cta.style.borderTopColor = 'rgba(232, 0, 29, 0.25)';
            cta.className = 'race-cta visible';
        } else {
            cta.innerHTML = `<span class="cta-text">Type</span><span class="cta-cmd">!race</span><span class="cta-text">to enter</span>`;
            cta.style.background = 'rgba(245, 196, 0, 0.07)';
            cta.style.borderTopColor = 'rgba(245, 196, 0, 0.15)';
            cta.className = 'race-cta visible';
        }

        // Trigger overlay exactly once when list hits full
        if (isFull) triggerFullOverlay();
    }

    function startPager() {
        clearInterval(pageTimer);
        // Don't even start the timer until page 1 is completely full
        if (allEntries.length < PER_PAGE) return;
        const pages = Math.ceil(allEntries.length / PER_PAGE);
        if (pages <= 1) return;

        pageTimer = setInterval(() => {
            const currentPageFull = allEntries.length >= (currentPage + 1) * PER_PAGE;
            if (currentPageFull) {
                currentPage = (currentPage + 1) % Math.ceil(allEntries.length / PER_PAGE);
                renderPage(false);
            }
        }, 6000);
    }

    function escHtml(s) {
        return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function setConnected(ok) {
        document.getElementById('sdot').className = 'status-dot' + (ok ? ' live' : '');
        document.getElementById('error-bar').style.display = ok ? 'none' : 'block';
    }

    function connect() {
        ws = new WebSocket(WS_URL);
        ws.onopen = () => {
            setConnected(true);
            ws.send('send_queue');
            setInterval(() => {
                if (ws.readyState === WebSocket.OPEN) ws.send('send_queue');
            }, 2000);
        };
        ws.onclose = () => { setConnected(false); setTimeout(connect, 5000); };
        ws.onerror = () => setConnected(false);
        ws.onmessage = (e) => {
            try {
                const data = JSON.parse(e.data);
                if (!Array.isArray(data)) return;

                const fp = fingerprint(data);
                if (fp === lastFingerprint) return;

                const isFirstLoad = lastFingerprint === '';

                // On first load, pre-arm the guard if already full — no celebration for a pre-filled list
                if (isFirstLoad && data.length >= MAX_ENTRIES) overlayShown = true;

                // Reset overlay guard if list was cleared
                if (data.length < MAX_ENTRIES) overlayShown = false;

                followNewestEntry(allEntries.length, data.length);
                lastFingerprint = fp;
                allEntries = data;
                renderPage(true);
                startPager();
            } catch(_) {}
        };
    }

    renderPage(false);
    connect();
</script>
</body>
</html>
